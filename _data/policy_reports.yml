- year: 2025
  title: "Results and Impact Evaluation of “Treball als Barris de Manresa”"
  title_local: "Avaluació de resultats i impacte del Programa Treball als barris de Manresa"
  client: "Ajuntament de Manresa"
  role: "co-authorship"
  language: "Catalan"
  summary: "The aim of this study is to evaluate the overall impact of the “Treball als Barris” program in the municipality of Manresa, both in terms of employment and social impact. First, a systematic literature review of similar programs is conducted. Second, the study analyzes the employment and social trajectories of participants, how the program interventions have influenced these trajectories, and which profiles have responded best to each intervention. Third, a case study is carried out using focus groups to gain a deeper understanding of the participants’ experiences. Finally, a counterfactual analysis is performed to measure the program’s impact on the participants."
  links:
    - label: "Read report (Catalan)"
      url: "https://www.ksnet.eu/wp-content/uploads/2026/01/AVALUACIO-DE-RESULTATS-I-IMPACTE-DEL-PROGRAMA-TREBALL-ALS-BARRIS-DE-MANRESA.pdf"

- year: 2025
  title: "Evaluation of measures to promote educational continuity in post-compulsory education"
  title_local: "Avaluació de les mesures per impulsar la continuïtat educativa en l’etapa post-obligatòria. Què poden fer els centres educatius?"
  client: "Consorci d'Educació de Barcelona"
  role: "co-authorship"
  language: "Catalan"
  summary: "The study comprises four main evaluations on early school leaving in compulsory secondary education. The first aims to measure the effect of the characteristics (in the pedagogical, organisational, and material dimensions) of high-complexity schools on the continuity of students into post-compulsory studies. The other three seek to analyse the effect of specific schooling measures on the completion of intermediate vocational training programmes: the guidance council, the prioritisation of continuity enrollment, and scholarships."
  links:
    - label: "Read report (Catalan)"
      url: "https://www.edubcn.cat/rcs_gene/extra/01_documents_de_referencia/informes/20250312_Informe_KSNET_abandonament_Complet.pdf"
    - label: "Check final presentation (Catalan)"
      url: "https://www.edubcn.cat/rcs_gene/extra/01_documents_de_referencia/informes/20250612_Presentacio_completa_mesures_contra_abandonament.pdf"

