  summary: "It aims to review the set of reform proposals for the Spanish local financing model that have been developed over the last decade. In the case of municipalities, this review refers to the two key pieces of the model: the resources that come from their tax basket and the resources that come from transfers granted by other administrations. And in the case of supra-municipal administrations, it basically refers to the transfers they receive from other levels of government."
