  summary: "This second edition of the Report entitled \"*Situation of People with Intellectual Disabilities in Catalonia*\" is based on updated data collected in 2023. The objective is to understand the socio-economic reality of people with disabilities in Catalonia over the past year (up to the latest available data from 2023) and compare it with the trends of recent years, identify critical areas where public policies are falling short, and propose policy recommendations to improve the quality of life of people with intellectual disabilities."
