- year: 2023
  title: "Active employment policies in Extremadura"
  title_local: "Políticas activas de empleo en Extremadura"
  client: "AIReF"
  role: "collaboration within the RedEV Team"
  language: "Spanish"
  summary: "This study aims to evaluate the effectiveness of the three main categories of programs that constitute the active employment policies implemented by the Public Employment Service of Extremadura (SEXPE): employment incentives in the private sector, direct job creation in the public sector, and training initiatives. The study seeks to identify areas for improvement in the allocation of public resources. To this end, eight programs from these three categories, designed to enhance the employability of individuals experiencing unemployment, have been selected and analyzed in terms of their effectiveness. Causal methodologies have been used to assess the impact of each employment program."
  links:
    - label: "Read report"
      url: "https://www.airef.es/wp-content/uploads/2023/11/EXTREMADURA/Estudio-Poli%CC%81ticas-Activas-de-Empleo-en-Extremadura.pdf"

- year: 2023
  title: "Implementation evaluation of intensive measures and supports for students with special educational needs"
  title_local: "Avaluació de la implementació de les mesures i suports intensius dirigits als alumnes amb necessitats educatives especials"
  client: "Departament d'Educació, Generalitat de Catalunya."
  role: "co-authorship"
  language: "Catalan"
  summary: "The main purpose of this evaluation was to determine how the services, resources and activities analyzed work and their adequacy to the existing needs within the framework of an inclusive educational system. Thus, the actions, resources and educational services under evaluation were: the intensive measures and support (MSI) aimed at students with special educational needs (SEN), the actions of the EAPs aimed at students with SEN due to the key role they play in the psycho-pedagogical evaluation for the recognition of NESE – specifically, SEN -, and the counseling they provide to the entire educational community – and the CRETDICs – to support students with developmental and behavioral disorders, and counseling in the educational community"
  links:
    - label: "Read report"
      url: "https://educacio.gencat.cat/web/.content/home/departament/avaluacio-politiques-publiques/avaluacions-finalitzades/educacio-inclusiva/avaluacio-policy-brief.pdf"

- year: 2023
  title: "Development of a model for community detection and early intervention in at-risk case"
  title_local: "Desarrollo del modelo de detección comunitaria e intervención temprana en casos de situación de riesgo"
  client: "UNICEF"
  role: "collaboration within the KSNET team"
  language: "Spanish"
  summary: "This work consists of the design of a methodology model for detection and intervention at the local level in situations of risk for children and adolescents from a community, preventive and gender perspective, based on comprehensive support centered on each person and on children’s rights. The objectives of the research are (i) to design the model of intervention in risk situations at the local level, differentiating between the detection model and the model of intervention in a situation of moderate risk (ii) to improve the system of detection and local intervention in risk situations (iii) to generate and disseminate knowledge to facilitate its replicability in other municipalities. The results to be achieved are (i) diagnosis of the situation (ii) map of resources, measures and actions (iii) bank of good practices (iv) proposal of the community and integral intervention model (v) proposal of the community and integral intervention model. For the development of the project, 10 pilot municipalities have been selected to serve as the basis for the analysis and will participate in the process of designing the detection and intervention model."
  links:
    - label: "Read report"
      url: "https://ciudadesamigas.org/proteccion-a-la-infancia-desde-lo-local/documentos/"

- year: 2022
  title: "How much would it cost to guarantee two weeks of summer camp for all vulnerable children in each municipality?"
  client: "Fundació Jaume Bofill, Estiu Enriquit"
  role: "co-authorship"
  language: "Catalan"
  summary: "This article focuses on summer camps, an activity that many families cannot afford for economic reasons. KSNET makes the necessary calculations in order to establish the necessary investment to ensure that vulnerable children can access at least five summer activities, establishing different scenarios according to the profile of the students and the area."

